name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package .app (build.sh)
        run: bash scripts/build.sh "${GITHUB_REF_NAME#v}"

      - name: Code sign
        run: codesign --force --sign - build/dev_mon-${GITHUB_REF_NAME#v}.app

      - name: Package as .zip
        run: |
          rm -f build/dev_mon-*.zip
          cd build
          ditto -c -k --keepParent "dev_mon-${GITHUB_REF_NAME#v}.app" "dev_mon-${GITHUB_REF_NAME}.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/dev_mon-*.zip

      - name: Update Homebrew tap
        env:
          GH_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${GH_PAT}@github.com/Cherno76/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          sed -i '' "s/version \"[0-9.]*\"/version \"${VERSION}\"/" Casks/dev_mon.rb
          git add .
          git -c user.name='dev_mon CI' -c user.email='dev-mon-ci@github.com' \
            commit -m "chore: bump dev_mon to v${VERSION}"
          git push
